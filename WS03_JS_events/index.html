<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 3</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Minun lempieläin</h1>

    <p>Moi nimeni on Jessica ja minun lempieläimeni on kissa.</p>

    <img src="attack.jpg" alt="Kissa, jolla on suu auki">
    <br>
    <a href="https://fi.wikipedia.org/wiki/Kissa"> Opi lisää kissoista!!</a>

    
    <!-- Harjoitus 1 -->

     <h2 id="AnimalTitle">Harjoitus 1: Klikkaus</h2>

    <p>
        <button id = "button" onclick="showMessage()">Paina minua</button>
        <button id = "button" onclick="showTable()">Näytä eläintaulukko</button>
    </p>

    <div id="tableContainer"></div>

    <hr>


    <!-- Harjoitus 2 -->

    <h2 id = "Harjoitus2"> Harjoitus 2: Kuuntelijat ja DOM </h2>

    <hr>

    <!-- Harjoitus 3 -->

    <h3>Kirjoita viesti kissalleni</h3>

    <form id="feedbackForm" novalidate>
        <label for="feedback">Palaute:</label><br>
        <textarea id="feedback" placeholder="Kirjoita viestisi..." rows="5"></textarea><br>

        <div style="margin: 4px 0;">
            <span id="charcount">0/200</span>
            <span id="status" aria-live="polite" style="margin-left: 8px; color: #666;"></span>
        </div>

        <button id="sendBtn" type="submit">Lähetä</button>
    </form>

    <h3>Esikatselu</h3>
    <div id="preview" style="border: 1px solid #c5de86; padding: 8px; min-height: 40px; background: #fafff5;">
        (Esikatselu tulee tähän)
    </div>

    <hr>

    <!-- Harjoitus 5 -->

    <div id="keybox" style="padding: 20px; border: 1px solid #c5de86; background: #fafff5; font-size: 1.2em;">
        Paina mitä tahansa näppäintä...
    </div>

    <p id="keyinfo"></p>

</body>
</html>
